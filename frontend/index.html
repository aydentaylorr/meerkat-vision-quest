<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Meerkat Vision Quest</title>
<style>
/* ==========================================================================
   MEERKAT VISION QUEST — v2 "step into Nomi's world"
   Single file. Hand-built vector world, no external assets.
   ========================================================================== */
:root{
  --sky-1:#cfeaf8; --sky-2:#eaf7fd;
  --dune-far:#fbe3b4; --dune-mid:#f7cd8c; --dune-main:#f3bd72;
  --dune-low:#eaa757; --dune-sh:#dd914a; --dune-deep:#cf7f3d;
  --rock:#c87d4f; --rock-d:#a75f3b; --rock-l:#dda071;
  --cact:#6cc077; --cact-d:#489a56;
  --leaf:#57a862; --leaf-d:#3d8a4f; --trunk:#8d5a39;
  --water:#7ad4e2; --water-l:#b6ecf4;
  --pot:#d08c53; --pot-d:#a6603a;
  --cream:#fffaf0; --cream-2:#fff3dd; --line:#f2ddb0;
  --brown:#6b4423; --brown-soft:#9a7350;
  --green:#7ac943; --green-d:#57a02c;
  --orange:#f0a038; --orange-d:#cf7d17;
  --blue:#4bb3e6; --blue-d:#2c8cbd;
  --purple:#a284d8; --purple-d:#7b5cb8;
  --red:#ef7566; --red-d:#c9503f;
  --gold:#ffc94d;
  --fs:1;
  --ui:'Baloo 2','Nunito','Quicksand','Avenir Next Rounded','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#eaa757;}
body{font-family:var(--ui);color:var(--brown);font-size:calc(16px*var(--fs));-webkit-font-smoothing:antialiased;}
body.reduce-motion *{animation:none!important;transition:none!important;}
body.contrast{--cream:#151318;--cream-2:#1e1a22;--line:#4a3f52;--brown:#fff6e6;--brown-soft:#d8c6b2;}

/* ---------------------------------------------------------------- world */
#world{position:fixed;inset:0;overflow:hidden;}
#scene{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block;}
#nodes,#fx{position:absolute;inset:0;}
#fx{pointer-events:none;}
#fx.live{pointer-events:auto;}

.node{position:absolute;transform:translate(-50%,-50%);cursor:pointer;}
.node svg{width:100%;height:auto;display:block;overflow:visible;}
.node.locked{cursor:not-allowed;}
.node .badgeicon{position:absolute;right:-4%;top:26%;width:26%;filter:drop-shadow(0 3px 4px rgba(90,55,20,.35));}
.node.current .glowring{animation:ring 2.4s ease-in-out infinite;transform-origin:center;}
@keyframes ring{0%,100%{opacity:.5}50%{opacity:1}}
.node .label{
  position:absolute;left:50%;bottom:-10%;transform:translateX(-50%);
  background:rgba(255,250,240,.94);color:var(--brown);
  padding:.18em .7em;border-radius:999px;font-weight:800;font-size:.72rem;
  white-space:nowrap;box-shadow:0 3px 0 rgba(160,110,60,.25);opacity:0;transition:opacity .18s;pointer-events:none;
}
.node:hover .label,.node.current .label{opacity:1;}

#hero{position:absolute;transform:translate(-50%,-84%);width:7.8%;pointer-events:none;z-index:5;}
#hero svg{width:100%;height:auto;display:block;}
#hero.walk{transition:left 1.1s cubic-bezier(.5,0,.5,1),top 1.1s cubic-bezier(.5,0,.5,1);}
.bob{animation:bob 2.8s ease-in-out infinite;transform-origin:50% 100%;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
#pointer{position:absolute;transform:translate(-50%,-50%);width:5.4%;pointer-events:none;
  animation:nudge 1.5s ease-in-out infinite;z-index:4;}
@keyframes nudge{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-64%,-50%)}}

/* ------------------------------------------------------------------ HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20;}
#hud > *{pointer-events:auto;}
.shadowbox{box-shadow:0 5px 0 rgba(150,100,50,.22),0 10px 22px rgba(120,70,20,.16);}
#streak{position:absolute;left:0;top:14px;display:flex;align-items:center;gap:.5rem;
  background:var(--cream);border-radius:0 22px 22px 0;padding:.5rem 1rem .5rem .7rem;}
#streak .n{line-height:1.05;font-weight:900;font-size:1rem;}
#streak .n small{display:block;font-size:.68rem;font-weight:700;color:var(--brown-soft);letter-spacing:.02em;}
#rings{position:absolute;left:50%;top:14px;transform:translateX(-50%);
  display:flex;gap:.5rem;background:var(--cream);border-radius:22px;padding:.45rem .75rem;}
#rings svg{width:38px;height:38px;display:block;}
#topright{position:absolute;right:0;top:14px;display:flex;align-items:center;gap:.55rem;
  background:var(--cream);border-radius:22px 0 0 22px;padding:.45rem .7rem .45rem 1rem;cursor:pointer;}
#topright svg.coin{width:26px;height:26px;}
#topright svg.chest{width:36px;height:36px;}
#topright b{font-size:.9rem;}
.cornerbtn{position:absolute;width:44px;height:44px;border:none;border-radius:16px;
  background:var(--cream);display:grid;place-items:center;cursor:pointer;font-size:1.15rem;color:var(--brown);}
#gearbtn{right:14px;top:74px;} #homebtn{left:14px;top:74px;} #profbtn{right:14px;top:126px;} #profbtn svg{width:24px;height:24px;}
select.vinput{appearance:none;-webkit-appearance:none;cursor:pointer;text-align-last:center;font-size:1.1rem;}
.autherr{min-height:1.3rem;margin:.2rem 0;text-align:center;font-weight:800;color:var(--red-d);font-size:.9rem;}
#hudmsg{position:absolute;left:50%;top:74px;transform:translateX(-50%);background:var(--cream);
  border-radius:18px;padding:.4rem 1rem;font-weight:800;font-size:.88rem;text-align:center;}

/* ----------------------------------------------------------- floating card */
#cards{position:fixed;inset:0;pointer-events:none;z-index:30;display:flex;justify-content:center;}
#cards.dock{align-items:flex-end;}
#cards.focus{align-items:center;padding:1rem;}
#cards.strip{align-items:flex-end;}
.panel{
  pointer-events:auto;background:var(--cream);
}
/* bottom dock — briefings and story sit flush with the bottom edge */
.panel.dock{
  width:min(820px,100%);border-radius:36px 36px 0 0;
  padding:1.6rem 2rem calc(1.7rem + env(safe-area-inset-bottom));
  max-height:72vh;overflow:auto;
  box-shadow:0 -6px 0 rgba(150,100,50,.16),0 -20px 50px rgba(110,65,20,.24);
  animation:dockin .34s cubic-bezier(.2,1.1,.4,1);
}
/* centred play surface — the exercise itself */
.panel.focus{
  width:min(700px,94vw);border-radius:36px;padding:2rem 2.2rem;max-height:90vh;overflow:auto;
  box-shadow:0 12px 0 rgba(150,100,50,.2),0 30px 70px rgba(90,50,10,.4);
  animation:cardin .34s cubic-bezier(.2,1.2,.4,1);
}
/* slim strip — keeps the world visible during eye exercises */
.panel.strip{
  width:min(720px,94vw);border-radius:28px;padding:.9rem 1.4rem;margin-bottom:1.6rem;
  box-shadow:0 6px 0 rgba(150,100,50,.18),0 16px 34px rgba(110,65,20,.22);
  animation:dockin .3s ease;
}
.panel .inner{max-width:480px;margin:0 auto;}
.panel.focus .inner,.panel.strip .inner{max-width:none;}
@keyframes cardin{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
@keyframes dockin{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
#scrim{position:fixed;inset:0;z-index:29;background:rgba(56,32,10,.42);opacity:0;pointer-events:none;transition:opacity .28s;}
#scrim.on{opacity:1;}

.ctitle{font-size:.9rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--brown-soft);text-align:center;}
.chead{font-size:2rem;font-weight:900;text-align:center;margin:.1em 0 .12em;line-height:1.1;}
.panel.strip .chead{font-size:1.35rem;margin:0;}
.cbody{font-size:1.15rem;line-height:1.6;text-align:center;}
.cbody .pw{visibility:hidden;}
.cbody .pw.active{visibility:visible;background:#ffe9b3;border-radius:5px;box-shadow:0 0 0 .15em #ffe9b3;}
.cbig{font-size:4.2rem;font-weight:900;text-align:center;letter-spacing:.06em;margin:.12em 0;text-transform:uppercase;line-height:1.1;}
.csym{font-size:4.6rem;text-align:center;line-height:1.15;}
.cart{width:62%;margin:.1rem auto;display:block;}
.cmuted{color:var(--brown-soft);font-size:1rem;line-height:1.5;}
.panel.strip .cmuted{font-size:.88rem;}
.center{text-align:center;}
.stack{display:flex;flex-direction:column;gap:.6rem;}
.flashbox{min-height:150px;display:grid;place-items:center;}

.abtn{
  display:block;width:100%;max-width:460px;margin-left:auto;margin-right:auto;
  border:none;font-family:inherit;font-weight:900;
  font-size:1.35rem;letter-spacing:.06em;color:#fff;text-transform:uppercase;
  padding:.9rem 1rem;border-radius:22px;cursor:pointer;
  background:var(--green);box-shadow:0 6px 0 var(--green-d);
  transition:transform .06s,box-shadow .06s,filter .12s;
}
.abtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d);}
.abtn.o{background:var(--orange);box-shadow:0 5px 0 var(--orange-d);}
.abtn.b{background:var(--blue);box-shadow:0 5px 0 var(--blue-d);}
.abtn.p{background:var(--purple);box-shadow:0 5px 0 var(--purple-d);}
.abtn.r{background:var(--red);box-shadow:0 5px 0 var(--red-d);}
.abtn.ghost{background:var(--cream-2);color:var(--brown);box-shadow:0 5px 0 var(--line);}
.abtn.sm{font-size:1.02rem;padding:.62rem .9rem;letter-spacing:.01em;text-transform:none;}
.abtn.right{background:var(--green)!important;box-shadow:0 5px 0 var(--green-d)!important;}
.abtn.wrong{background:var(--red)!important;box-shadow:0 5px 0 var(--red-d)!important;}
.abtn:disabled{filter:saturate(.45) opacity(.65);cursor:default;}

.vinput{display:block;width:100%;max-width:280px;margin:.7rem auto;padding:.7rem 1rem;
  font-family:inherit;font-size:1.4rem;font-weight:800;text-align:center;text-transform:uppercase;
  letter-spacing:.06em;color:var(--brown);background:var(--cream);
  border:3px solid var(--line);border-radius:16px;}
.vinput:focus{outline:none;border-color:var(--orange);}
.vinput:disabled{opacity:.7;}
.vinput.right{border-color:var(--green);background:#eaf9de;}
.vinput.wrong{border-color:var(--red);background:#fdeceb;}

.dots{display:flex;gap:.35rem;justify-content:center;margin:.55rem 0 .2rem;}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dots i.on{background:var(--orange);width:20px;border-radius:5px;}

.hintbar{display:flex;gap:.5rem;align-items:flex-start;background:var(--cream-2);
  border-radius:16px;padding:.55rem .75rem;font-size:.8rem;line-height:1.4;margin-top:.55rem;}
.notice{background:#fff2d2;border-radius:16px;padding:.6rem .8rem;font-size:.8rem;line-height:1.45;}
body.contrast .notice{background:#2a2410;}

.mgrid{display:grid;gap:.5rem;margin-top:.5rem;}
.mcard{aspect-ratio:1/1;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;cursor:pointer;
  background:linear-gradient(180deg,#e9a95c,#dd914a);box-shadow:0 4px 0 #b9762f;}
.mcard.up{background:linear-gradient(180deg,#fffaf0,#fff0d6);box-shadow:0 4px 0 var(--line);}
.mcard.matched{background:linear-gradient(180deg,#9be07f,#7ac943);box-shadow:0 4px 0 var(--green-d);}
.mmgrid{display:grid;gap:.6rem;margin:.6rem auto 0;width:100%;}
.mmcard{aspect-ratio:1/1;border-radius:18px;display:grid;place-items:center;cursor:pointer;user-select:none;
  font-size:var(--mfs,3rem);line-height:1;color:#fff;
  background:linear-gradient(180deg,#e9a95c,#dd914a);box-shadow:0 5px 0 #b9762f;}
.mmcard .back{font-size:.62em;opacity:.55;}
.mmcard.up{background:linear-gradient(180deg,#fffaf0,#fff0d6);box-shadow:0 5px 0 var(--line);animation:mflip .22s ease;}
.mmcard.matched{background:linear-gradient(180deg,#9be07f,#7ac943);box-shadow:0 5px 0 var(--green-d);cursor:default;animation:mflip .22s ease;}
@keyframes mflip{from{transform:scale(.86)}to{transform:scale(1)}}

.srow{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.45rem 0;border-bottom:2px dotted var(--line);}
.srow:last-child{border-bottom:none;}
.tag{border-radius:999px;padding:.1rem .55rem;font-weight:900;font-size:.72rem;color:#fff;}
.tag.p{background:var(--green);} .tag.f{background:var(--red);}

/* in-world exercise bits */
.tgt{position:absolute;width:5.2%;transform:translate(-50%,-50%);cursor:pointer;pointer-events:auto;animation:pop .2s ease;}
.tgt svg,.flyer svg,.spot svg,#focusObj svg{width:100%;height:auto;display:block;}
@keyframes pop{from{opacity:0}to{opacity:1}}
.spot{position:absolute;width:1.8%;transform:translate(-50%,-50%);opacity:.35;}
.flyer{position:absolute;width:5.5%;transform:translate(-50%,-50%);pointer-events:none;}
#tapcatch{position:absolute;inset:0;cursor:pointer;}
.toastfx{position:fixed;left:50%;bottom:5%;transform:translateX(-50%);background:rgba(60,35,15,.9);color:#fff9ec;
  padding:.6rem 1.1rem;border-radius:999px;font-weight:800;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.3);}
#night{position:fixed;inset:0;z-index:10;pointer-events:none;transition:opacity .6s;opacity:0;
  background:radial-gradient(ellipse at 50% 45%,rgba(12,20,45,.12),rgba(10,16,38,.6));}
#night.on{opacity:1;}

/* travel curtain between the map and a level */
.wipe{
  position:fixed;inset:0;z-index:45;pointer-events:none;
  background:linear-gradient(100deg,#f3bd72 0%,#e08a3c 40%,#d9853c 60%,#f3bd72 100%);
  transform:translateX(-104%);transition:transform .48s cubic-bezier(.5,0,.5,1);
}
.wipe.in{transform:translateX(0);}
.wipe.out{transform:translateX(104%);}
.wipe::after{
  content:'';position:absolute;inset:0;opacity:.35;
  background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.5),transparent 40%),
             radial-gradient(circle at 70% 65%,rgba(255,255,255,.35),transparent 38%);
}

/* sheets */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(60,35,15,.45);display:grid;place-items:center;padding:1rem;}
.sheetbox{background:var(--cream);border-radius:28px;width:min(680px,96vw);max-height:92vh;overflow:auto;
  padding:1.15rem 1.25rem;box-shadow:0 20px 50px rgba(60,35,15,.4);animation:cardin .3s ease;}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.55rem 0 .85rem;}
.tab{border:none;background:var(--cream-2);border-radius:999px;padding:.42rem .9rem;font-family:inherit;
  font-weight:800;font-size:.86rem;color:var(--brown);cursor:pointer;}
.tab.on{background:var(--brown);color:var(--cream);}
table{width:100%;border-collapse:collapse;font-size:.84rem;}
th,td{text-align:left;padding:.38rem .35rem;border-bottom:1px solid var(--line);}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--brown-soft);}
.bars{display:flex;align-items:flex-end;gap:.5rem;height:104px;}
.bars .b{flex:1;background:linear-gradient(180deg,#7fd0ee,#4bb3e6);border-radius:8px 8px 0 0;min-height:4px;position:relative;}
.bars .b span{position:absolute;bottom:-1.35rem;left:0;right:0;text-align:center;font-size:.66rem;color:var(--brown-soft);}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:.55rem;}
.item{background:var(--cream-2);border-radius:18px;padding:.65rem .4rem;text-align:center;font-weight:800;font-size:.75rem;cursor:pointer;box-shadow:0 4px 0 var(--line);}
.item .em{font-size:1.75rem;display:block;}
.item.locked{opacity:.45;}
.item.on{box-shadow:0 4px 0 var(--green-d);background:#eaf9de;}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.5rem 0;border-bottom:1px dotted var(--line);}
.switch{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;border:none;flex:0 0 52px;}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .16s;}
.switch.on{background:var(--green);} .switch.on i{left:25px;}
h2.sh{font-size:1.12rem;font-weight:900;margin:.2em 0 .4em;}
.statgrid{display:flex;flex-wrap:wrap;gap:1.1rem;}
.statgrid div b{font-size:1.3rem;display:block;}

@media (max-width:700px){
  #cards.focus{padding:.6rem;}
  .panel.dock{padding:1.2rem 1.2rem calc(1.3rem + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;}
  .panel.focus{padding:1.3rem 1.2rem;border-radius:28px;}
  .chead{font-size:1.6rem;}
  .cbig{font-size:3.1rem;}
  .abtn{font-size:1.15rem;padding:.78rem .9rem;}
  #streak{padding:.4rem .7rem .4rem .5rem;}
  #streak .n{font-size:.85rem;}
}
</style>
</head>
<body>
<div id="world">
  <div id="scene">
    <svg id="bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <div id="nodes"></div>
    <div id="fx"></div>
  </div>
</div>
<div id="night"></div>
<div id="hud"></div>
<div id="scrim"></div>
<div id="cards"></div>
<script>
/* =========================================================================
   MEERKAT VISION QUEST — v2
   The world is the interface: an illustrated desert you play inside.
   ========================================================================= */

/* ------------------------------------------------------------- utilities */
const $  = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
const pct = v => Math.round(v*100) + '%';
const dayKey = (d=new Date()) => d.toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const store = {
  read(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } },
  write(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  remove(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
let TIMERS = [], RAF = null;
const later = (fn, ms) => { const t = setTimeout(fn, ms); TIMERS.push(t); return t; };
function clearTimers(){ TIMERS.forEach(clearTimeout); TIMERS = []; if(RAF){ cancelAnimationFrame(RAF); RAF = null; } }

/* ==========================================================================
   ART — every pixel of this world is drawn here
   ========================================================================== */
const ART = {};

ART.cloud = (x,y,s,o=.92) => `<g transform="translate(${x},${y}) scale(${s})" opacity="${o}">
  <ellipse cx="0" cy="0" rx="54" ry="24" fill="#fff"/>
  <ellipse cx="-34" cy="6" rx="30" ry="16" fill="#fff"/>
  <ellipse cx="30" cy="7" rx="34" ry="17" fill="#fff"/>
  <ellipse cx="-8" cy="-16" rx="30" ry="20" fill="#fff"/>
  <ellipse cx="20" cy="-10" rx="22" ry="15" fill="#fff"/></g>`;

/* Chunky storybook cactus. Origin sits on the ground line. */
ART.cactus = (x,y,s,face=false) => `<g transform="translate(${x},${y}) scale(${s})">
  <ellipse cx="0" cy="2" rx="34" ry="9" fill="#c9762f" opacity=".3"/>
  <g stroke="#5fb56c" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-19 -36 H-37 V-60" stroke-width="21"/>
    <path d="M19 -54 H38 V-76" stroke-width="19"/></g>
  <g stroke="#4a9d59" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".45">
    <path d="M-37 -46 V-59" stroke-width="21"/>
    <path d="M38 -63 V-75" stroke-width="19"/></g>
  <rect x="-23" y="-92" width="46" height="94" rx="23" fill="#6cc077"/>
  <rect x="-18" y="-86" width="12" height="76" rx="6" fill="#8ed894" opacity=".75"/>
  <rect x="9" y="-84" width="12" height="72" rx="6" fill="#3f9152" opacity=".28"/>
  <g stroke="#3f9152" stroke-width="2.6" opacity=".4" stroke-linecap="round">
    <path d="M0 -80 v8"/><path d="M0 -60 v8"/><path d="M0 -40 v8"/><path d="M0 -20 v8"/>
    <path d="M-37 -52 v6"/><path d="M38 -68 v6"/></g>
  ${face ? `<ellipse cx="-8" cy="-62" rx="3.6" ry="4.6" fill="#2f5c39"/>
    <ellipse cx="8" cy="-62" rx="3.6" ry="4.6" fill="#2f5c39"/>
    <path d="M-7 -52 q7 7 14 0" stroke="#2f5c39" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <ellipse cx="-16" cy="-55" rx="4.5" ry="3" fill="#ff9d9d" opacity=".45"/>
    <ellipse cx="16" cy="-55" rx="4.5" ry="3" fill="#ff9d9d" opacity=".45"/>` : ''}</g>`;

/* Rounded pebble rock with a sunlit top face. */
ART.rock = (x,y,s,flip=1) => `<g transform="translate(${x},${y}) scale(${s*flip},${s})">
  <ellipse cx="0" cy="14" rx="33" ry="8" fill="#c9762f" opacity=".3"/>

ART.pawTrail = (x1,y1,x2,y2,bend=0) => {
  const mx = (x1+x2)/2, my = (y1+y2)/2;
  const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy) || 1;
  const cx = mx - dy/len*bend, cy = my + dx/len*bend;
  const n = Math.max(8, Math.round(len/34));
  let out = '';
  for(let i = 1; i < n; i++){
    const t = i/n, u = 1-t;
    const px = u*u*x1 + 2*u*t*cx + t*t*x2;
    const py = u*u*y1 + 2*u*t*cy + t*t*y2;
    const tx = 2*u*(cx-x1) + 2*t*(x2-cx);
    const ty = 2*u*(cy-y1) + 2*t*(y2-cy);
    const ang = Math.atan2(ty,tx)*180/Math.PI;
    const side = (i % 2 ? 9 : -9);
    out += `<g transform="translate(${px.toFixed(1)},${py.toFixed(1)}) rotate(${ang.toFixed(1)}) translate(0,${side})" opacity=".5">
      <ellipse rx="7" ry="5" fill="#c9762f"/>
      <ellipse cx="7" cy="-4.5" rx="2.4" ry="2" fill="#c9762f"/>
      <ellipse cx="8.4" cy="0.6" rx="2.4" ry="2" fill="#c9762f"/>
      <ellipse cx="6" cy="5" rx="2.4" ry="2" fill="#c9762f"/></g>`;
  }
  return out;
};

/* ==========================================================================
   SCENE SWITCHING + TRAVEL
   ========================================================================== */
const SCENE_HERO = { adv1:{ x:20, y:80 }, adv2:{ x:17, y:80 }, adv3:{ x:20, y:79 } };
let CUR_SCENE = 'map';

function setScene(key){
  CUR_SCENE = key;
  $('#bg').innerHTML = SCENES[key]();
  document.body.classList.toggle('in-level', key !== 'map');
  if(key === 'map') renderWorld();
  else renderLevelStage(key);
}

function renderLevelStage(key){
  const h = SCENE_HERO[key] || { x:20, y:78 };
  $('#nodes').innerHTML = `<div id="hero" style="left:${h.x}%;top:${h.y}%">${meerkatSVG()}</div>`;
}

/* sand-coloured curtain sweep between places */
function travel(sceneKey, then){
  if(S.settings.reduceMotion){ setScene(sceneKey); if(then) then(); return; }
  clearCard();
  const w = document.createElement('div');
  w.className = 'wipe';
  document.body.appendChild(w);
  requestAnimationFrame(() => w.classList.add('in'));
  setTimeout(() => {
    setScene(sceneKey);
    if(then) then();
    w.classList.add('out');
    setTimeout(() => w.remove(), 560);
  }, 480);
}

function renderWorld(){
  const nodes = LOCATIONS.map(l => {
    const done = isGradeDone(l.adv);
    const open = isGradeUnlocked(l.adv);
    const cur  = l.adv === currentGrade();
    const badge = done ? ART.tick : (open ? '' : ART.lock);
    return `<div class="node ${cur ? 'current' : ''} ${open ? '' : 'locked'}" id="node-${l.id}"
        style="left:${l.x}%;top:${l.y}%;width:${l.w}%"
        onclick="tapNode('${l.id}')">
      ${ART.loc[l.art](cur)}
      ${badge ? `<div class="badgeicon">${badge}</div>` : ''}
      <div class="label">${l.name}</div>
    </div>`;
  }).join('');

  const cur = LOCATIONS.find(l => l.adv === currentGrade()) || LOCATIONS[0];
  const hp = heroPos(cur);
  $('#nodes').innerHTML = nodes +
    `<div id="hero" style="left:${hp.x}%;top:${hp.y}%">${meerkatSVG()}</div>` +

function apiError(data, status){
  if(data && typeof data.detail === 'string') return data.detail;
  if(status === 422) return 'Please check what you typed and try again.';
  if(status >= 500) return 'The game server isn’t responding. Please try again in a moment.';
  return 'Something went wrong. Please try again.';
}
async function api(method, path, body, keepalive){
  let res;
  try{
    res = await fetch(path, {
      method, keepalive: !!keepalive,
      headers: Object.assign({}, body ? { 'content-type':'application/json' } : {}, TOKEN ? { 'x-session-token':TOKEN } : {}),
      body: body ? JSON.stringify(body) : undefined
    });
  }catch(e){ throw { status:0, message:'Can’t reach the game server. Please check your connection and try again.' }; }
  if(res.status === 204) return null;
  let data = null; try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw { status:res.status, message:apiError(data, res.status) };
  return data;
}

  clearTimeout(saveTimer); saveTimer = null;

function gradeInfo(grade){
  const i = grade - 1;
  return {
    grade, title: GRADE_TITLES[i], scene: GRADE_SCENES[i % 3],
    focusArt: GRADE_FOCUS_ART[i % 3], words: GRADE_WORDS[i],
    passage: GRADE_INTROS[i].join(' ')
  };
}
function gradeReward(grade){ return { cosmetic: COSMETICS[(grade - 1) % COSMETICS.length].id, gems: 20 + grade * 4 }; }
const gradeT = grade => (grade - 1) / (GRADES_COUNT - 1);
const gLerp  = (grade, a, b) => Math.round(a + (b - a) * gradeT(grade));
const gLerpf = (grade, a, b) => a + (b - a) * gradeT(grade);

function readConfig(grade){
  const gi = gradeInfo(grade);
  return {
    label: 'Reading', prompt: 'A story to read — twice — then a quick word check.',
    vocab: { rounds: gLerp(grade, 3, 5), flash: 500, pool: gi.words },
    passage: gi.passage, chunkSize: gLerp(grade, 2, 6), questions: GRADE_COMPREHENSION[grade - 1],
    pass: 0.5
  };
}
function memConfig(grade){
  const t = gradeT(grade);
  return {
    label: 'Card Match', prompt: 'Find the matching pairs.',
    pairs: gLerp(grade, 4, 8), cols: 4, time: t < 0.25 ? 0 : gLerp(grade, 90, 40), mode: 'identical',
    reshuffle: t > 0.6, pass: 0.45, pool: MEMORY_ICON_POOL
  };
}

  };

const isGradeDone = grade => gradeFullyDone(grade);
const isGradeUnlocked = grade => grade <= startGrade() || gradeFullyDone(grade - 1);
const startGrade = () => (USER && USER.start_grade) || 1;
function currentGrade(){
  for(let g = startGrade(); g <= GRADES_COUNT; g++) if(!gradeFullyDone(g)) return g;
  return GRADES_COUNT;
}

function ringSVG(state){
  const C = 2 * Math.PI * 15;
  const col = { done:'#7ac943', active:'#4bb3e6', idle:'#e2d6c4', fail:'#ef7566' }[state.k];
  const frac = state.frac;
  return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="#eee3d0" stroke-width="6"/>
    ${frac > 0 ? `<circle cx="20" cy="20" r="15" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 20 20)"/>` : ''}
    ${state.k === 'idle' ? `<circle cx="20" cy="20" r="15" fill="none" stroke="#e2d6c4" stroke-width="6"/>` : ''}</svg>`;
}

function renderHud(){
  if(!USER){ $('#hud').innerHTML = ''; return; }
  let ringsHtml;
  if(RUN){
    const meta = MODULE_META[RUN.moduleKey];
    ringsHtml = `<div style="display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:.1rem .4rem">

      <b style="font-size:.92rem;white-space:nowrap">All done! 🎉</b>
      <span class="cmuted" style="font-size:.66rem;white-space:nowrap">12 / 12 grades</span></div>`;
  } else {
    const grade = currentGrade();

      <b style="font-size:.92rem;white-space:nowrap">Grade ${grade}</b>

/* mode: 'dock' (bottom sheet) | 'focus' (centred play surface) | 'strip' (thin bar) */
/* Swaps the card's contents. When a card of the same kind is already showing it stays
   perfectly still (no pop-in), so only the contents change; pass animate=true to pop it in. */
function card(html, mode, animate){
  mode = mode || 'dock';
  const c = $('#cards');
  const panel = c.firstElementChild;
  if(!animate && panel && panel.classList.contains('panel') && panel.classList.contains(mode)){
    panel.firstElementChild.innerHTML = html;
    panel.scrollTop = 0;
  } else {
    c.innerHTML = `<div class="panel ${mode}"><div class="inner">${html}</div></div>`;
  }
  c.className = mode;
  $('#scrim').classList.toggle('on', mode === 'focus');
}
function clearCard(){ $('#cards').innerHTML = ''; $('#cards').className = ''; $('#scrim').classList.remove('on'); }
function night(on){ $('#night').classList.toggle('on', !!on); }
function setMsg(m){ VIEW.msg = m; renderHud(); }
function toast(msg){
  const d = document.createElement('div');
  d.className = 'toastfx'; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2200);
}
function applySettings(){
  document.documentElement.style.setProperty('--fs', S.settings.fs);
  document.body.classList.toggle('contrast', !!S.settings.contrast);
  document.body.classList.toggle('reduce-motion', !!S.settings.reduceMotion);
}

/* ==========================================================================
   MODULE RUNNER — every module (Reading, Visual Memory's 5 games, Scanning's
   tracking/symbol-search x 8 elements, Eye Therapy) goes through the same
   travel -> intro -> countdown -> play -> finishModule pipeline.
   ========================================================================== */
function startModuleRun(grade, moduleKey){
  if(checkSessionCap()) return true;
  clearTimers();
  RUN = { grade, moduleKey, retryFn:null };
  VIEW.msg = null;
  night(false); $('#fx').className = ''; $('#fx').innerHTML = '';
  renderHud();
  return false;
}

/* opts: { art, headline, params, prompt, extraHtml } */
function runModule(grade, moduleKey, opts, playFn){
  if(startModuleRun(grade, moduleKey)) return;
  RUN.retryFn = () => runModule(grade, moduleKey, opts, playFn);
  const gi = gradeInfo(grade);
  const meta = MODULE_META[moduleKey];
  travel(gi.scene, () => {
    renderHud();
    VIEW.mode = 'intro';
    card(`<div class="ctitle">${meta.name}</div>
      <div style="width:34%;margin:.3rem auto">${opts.art || ''}</div>
      <div class="chead">${opts.headline || meta.name}</div>
      <div class="center cmuted">${meta.clinical}</div>
      <div class="center cmuted" style="margin:.45rem 0 .7rem"><b>${opts.params || ''}</b></div>
      <button class="abtn" onclick="__moduleReady()">I’m ready</button>
      ${opts.extraHtml || ''}`, 'dock');
    window.__moduleReady = () => {
      window.__moduleReady = () => {};
      countdownThen(meta.name, opts.prompt || '', () => { VIEW.mode = 'play'; playFn(); });
    };
  });
}

function countdownThen(label, prompt, fn){
  let n = 3;
  card(`<div class="ctitle">${label}</div>
    <div class="cbig" id="cdNum" style="font-size:6rem;color:var(--orange)">3</div>
    <div class="cmuted center">${prompt}</div>`, 'focus');
  const tick = () => {
    n--;
    if(n < 0){ fn(); return; }
    const el = $('#cdNum'); if(el) el.textContent = n > 0 ? n : 'GO!';
    later(tick, 700);
  };
  later(tick, 700);
}

function finishModule(grade, moduleKey, score, pass, detailText){
  clearTimers(); night(false);
  $('#fx').className = ''; $('#fx').innerHTML = '';
  score = clamp(score, 0, 1);
  S.log.push({ ts:Date.now(), day:dayKey(), grade, module:moduleKey, score:Math.round(score*100), pass });
  if(S.log.length > 400) S.log = S.log.slice(-400);

  let note = null, newlyDone = false, gradeCompleteNow = false, reward = null, gemsWon = 0;
  if(pass){
    note = bumpStreak();
    if(!S.gradeProgress[grade]) S.gradeProgress[grade] = {};
    if(!S.gradeProgress[grade][moduleKey]){ S.gradeProgress[grade][moduleKey] = true; newlyDone = true; }
    gemsWon = 5 + grade;
    S.gems += gemsWon;
    if(newlyDone && gradeFullyDone(grade)){
      gradeCompleteNow = true;
      const rw = gradeReward(grade);
      S.gems += rw.gems;
      if(!S.owned.includes(rw.cosmetic)){
        S.owned.push(rw.cosmetic);
        const cos = cosmetic(rw.cosmetic);
        if(cos && !S.equipped[cos.slot]) S.equipped[cos.slot] = cos.id;
        reward = cos;
      }
    }
  }
  save();
  VIEW.mode = 'results'; VIEW.msg = null; renderHud();
  const meta = MODULE_META[moduleKey];
  card(`<div class="ctitle">${meta.name}</div>
    <div style="width:32%;margin:.2rem auto">${meerkatSVG()}</div>
    <div class="chead">${pass ? pick(['Great looking!','Sharp eyes!','You got it!','Well spotted!']) : 'Good try!'}</div>
    <div class="cbig" style="color:${pass ? 'var(--green-d)' : 'var(--red-d)'}">${pct(score)}</div>
    <div class="center cmuted">${detailText}</div>
    ${pass ? `<div class="center" style="margin:.5rem 0;font-weight:900">+${gemsWon} 💎 &nbsp; 🔥 ${S.streak.count} day${S.streak.count === 1 ? '' : 's'}</div>` : ''}
    ${gradeCompleteNow ? `<div class="notice"><b>Grade complete!</b> All 4 modules done — the next grade is unlocked!${reward ? ` New reward: ${reward.em} ${reward.name}.` : ''}</div>` : ''}
    ${note === 'freeze' ? `<div class="hintbar">🧊 <div>You missed a day, so a streak freeze was used. ${S.streak.freezes} left.</div></div>` : ''}
    <div class="stack" style="margin-top:.6rem">
      ${!pass ? `<button class="abtn o" onclick="retryModule()">Try again</button>` : ''}
      <button class="abtn ${pass ? '' : 'ghost sm'}" onclick="openGrade(${grade})">Back to modules</button>
      <button class="abtn ghost sm" onclick="toMap()">Back to the map</button>
    </div>`, 'focus', true);
}

/* reveals `text` as a moving "block" — only the current chunk of `chunkSize`
   words is visible at a time (everything before and after it is hidden),
   advancing through the passage at the given `wpm`. */
function revealChunksInto(elId, text, wpm, chunkSize, onDone){
  const words = text.split(' ');
  const el = document.getElementById(elId);
  if(el) el.innerHTML = words.map(w => `<span class="pw">${w}</span>`).join(' ');
  const intervalMs = Math.max(60000 / wpm, 90) * chunkSize;
  let i = 0;
  const tick = () => {
    const els = document.querySelectorAll('#' + elId + ' .pw');
    els.forEach(s => s.classList.remove('active'));
    for(let k = i; k < Math.min(i + chunkSize, els.length); k++) els[k].classList.add('active');
    i += chunkSize;
    if(i < els.length) later(tick, intervalMs);
    else later(() => {
      document.querySelectorAll('#' + elId + ' .pw').forEach(s => s.classList.remove('active'));
      onDone && onDone();
    }, intervalMs);
  };
  tick();
}

const BTN_COLOURS = ['', 'o', 'b', 'p', 'r'];

/* flashes `target` in a fixed spot for `flashMs`, then asks the child to type
   what they saw. Shared by Reading's word check and every Visual Memory game. */
function flashTypeRound(opts, onResult){
  const { target, flashMs, title, roundLabel } = opts;
  card(`<div class="ctitle">${title}</div>
    <div class="center cmuted" style="font-size:.92rem">${roundLabel}</div>
    <p class="cmuted center" style="margin:0 0 .3rem">Press Flash, then watch closely.</p>
    <div class="flashbox" id="flashBox"></div>
    <button class="abtn" id="flashBtn" onclick="__doFlash()">Flash</button>`, 'focus');
  window.__doFlash = () => {
    window.__doFlash = () => {};
    const btn = document.getElementById('flashBtn');
    if(btn) btn.disabled = true;
    const box = document.getElementById('flashBox');
    if(box) box.innerHTML = `<div class="cbig">${target}</div>`;
    later(() => {
      if(box) box.innerHTML = '';
      later(() => {
        card(`<div class="ctitle">${title}</div>
          <div class="center cmuted" style="font-size:.92rem">${roundLabel}</div>
          <div class="chead" style="margin:.5rem 0 .6rem">What did you see?</div>
          <input type="text" id="flashInput" class="vinput" autocomplete="off" autocapitalize="off" spellcheck="false" />
          <button class="abtn" onclick="__flashSubmit()">OK</button>`, 'focus');
        const inp = document.getElementById('flashInput');
        if(inp){ inp.focus(); inp.onkeydown = e => { if(e.key === 'Enter') window.__flashSubmit(); }; }
        window.__flashSubmit = () => {
          window.__flashSubmit = () => {};
          const inputEl = document.getElementById('flashInput');
          const typed = (inputEl.value || '').trim();
          const ok = typed.toLowerCase() === String(target).toLowerCase();
          inputEl.disabled = true;
          inputEl.classList.add(ok ? 'right' : 'wrong');
          if(!ok) inputEl.value = String(target);
          document.querySelectorAll('button.abtn').forEach(b => b.disabled = true);
          later(() => onResult({ ok, typed }), ok ? 700 : 1300);
        };
      }, 200);
    }, flashMs);
  };
}

const FLASH_MEMORY_NAME = { number:'Number Memory', lower:'Small Letter Memory', upper:'Capital Letter Memory', word:'Word Memory' };
function flashMemoryTarget(kind, grade){
  const t = gradeT(grade);
  if(kind === 'number'){
    const digits = Math.round(1 + t * 2);
    let n = ''; for(let i = 0; i < digits; i++) n += String(rnd(10));
    return n;
  }
  if(kind === 'lower' || kind === 'upper'){
    const count = Math.round(1 + t * 2);
    const letters = 'abcdefghijklmnopqrstuvwxyz';
    let s = ''; for(let i = 0; i < count; i++) s += letters[rnd(26)];
    return kind === 'upper' ? s.toUpperCase() : s;
  }
  return pick(gradeInfo(grade).words);
}
function startFlashMemory(grade, kind){
  const rounds = flashMemoryRounds(grade);
  runModule(grade, 'mem', {
    art: ART.wordCard, headline: FLASH_MEMORY_NAME[kind],
    params: `${rounds} rounds · 500ms flash`,
    prompt: 'Press Flash, watch closely, then type what you saw.'
  }, () => playFlashMemory(grade, kind, rounds));
}
function playFlashMemory(grade, kind, rounds){
  let round = 0, correct = 0;
  function next(){
    if(round >= rounds){
      const score = correct / rounds;
      finishModule(grade, 'mem', score, score >= 0.5, `${correct} of ${rounds} correct`);
      return;
    }
    const target = flashMemoryTarget(kind, grade);
    flashTypeRound({ target, flashMs:500, title:FLASH_MEMORY_NAME[kind], roundLabel:`Round ${round + 1} of ${rounds}` }, res => {
      if(res.ok) correct++;
      round++; next();
    });
  }
  next();
}
function startCardMatch(grade){
  const c = memConfig(grade);
  runModule(grade, 'mem', {
    art: ART.chest, headline: 'Card Match Memory',
    params: `${c.pairs} pairs${c.time ? ' · ' + c.time + 's limit' : ''}`,
    prompt: 'Find the matching pairs.'
  }, () => exMem(grade));
}

function startScanning(grade, subMode, elementKey){
  const label = ELEMENT_META.find(e => e.key === elementKey).label;
  if(subMode === 'tracking'){
    const c = trackingConfig(grade);
    runModule(grade, 'scan', {
      art: ART.wordCard, headline: 'Tracking', params: `${label} · ${c.seqLen} items in a row`,
      prompt: `Silently count how many times you see the target ${label.toLowerCase()}.`
    }, () => playTracking(grade, elementKey));
  } else {
    const c = symbolSearchConfig(grade);
    runModule(grade, 'scan', {
      art: ART.wordCard, headline: 'Symbol Search', params: `${label} · ${c.cols * c.rows} cells to search`,
      prompt: `Find every matching ${label.toLowerCase()} in the grid.`
    }, () => playSymbolSearch(grade, elementKey));
  }
}

function playTracking(grade, elementKey){
  const pool = elementPool(elementKey);
  const cfg = trackingConfig(grade);
  const target = pick(pool.items);
  const seq = [];
  for(let i = 0; i < cfg.targetCount; i++) seq.push(target);
  while(seq.length < cfg.seqLen) seq.push(pick(pool.items));
  const finalSeq = shuffle(seq);
  const actualCount = finalSeq.filter(x => x === target).length;

  card(`<div class="ctitle">Tracking</div>
    <div class="chead">Count the target</div>
    <p class="cmuted center" style="font-size:1.3rem;font-weight:800">${target}</p>
    <p class="cmuted center">Watch closely and silently count how many times it appears.</p>
    <div class="flashbox" id="trackBox"></div>
    <button class="abtn" id="trackStartBtn" onclick="__trackStart()">Start</button>`, 'focus');

  window.__trackStart = () => {
    window.__trackStart = () => {};
    const btn = document.getElementById('trackStartBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Watching…'; }
    let i = 0;
    const box = document.getElementById('trackBox');
    function tick(){
      if(i >= finalSeq.length){ later(askTrackingCount, 200); return; }
      if(box) box.innerHTML = `<div class="cbig">${finalSeq[i]}</div>`;
      i++;
      later(() => { if(box) box.innerHTML = ''; later(tick, 120); }, cfg.itemMs);
    }
    tick();
  };

  function askTrackingCount(){
    card(`<div class="ctitle">Tracking</div>
      <div class="chead">How many times did you see it?</div>
      <p class="cmuted center" style="font-size:1.3rem;font-weight:800">${target}</p>
      <input type="text" inputmode="numeric" id="trackInput" class="vinput" autocomplete="off" />
      <button class="abtn" onclick="__trackSubmit()">OK</button>`, 'focus');
    const inp = document.getElementById('trackInput');
    if(inp){ inp.focus(); inp.onkeydown = e => { if(e.key === 'Enter') window.__trackSubmit(); }; }
    window.__trackSubmit = () => {
      window.__trackSubmit = () => {};
      const typed = parseInt((document.getElementById('trackInput').value || '').trim(), 10);
      const ok = Number.isFinite(typed);
      const diff = ok ? Math.abs(typed - actualCount) : actualCount;
      const score = clamp(1 - diff / Math.max(actualCount, 1), 0, 1);
      finishModule(grade, 'scan', score, score >= 0.6, `You said ${ok ? typed : '—'} · it appeared ${actualCount} time${actualCount === 1 ? '' : 's'}`);
    };
  }
}

function playSymbolSearch(grade, elementKey){
  const pool = elementPool(elementKey);
  const cfg = symbolSearchConfig(grade);
  const target = pick(pool.items);
  const total = cfg.cols * cfg.rows;
  const cells = [];
  for(let i = 0; i < cfg.targetCount; i++) cells.push(target);
  while(cells.length < total) cells.push(pick(pool.items));
  const grid = shuffle(cells);
  const totalTargets = grid.filter(x => x === target).length;
  let found = 0, wrong = 0;
  const smallText = pool.kind === 'word';

  function draw(){
    card(`<div class="ctitle">Symbol Search</div>
      <div class="center cmuted" id="foundCount" style="font-size:.92rem">Found ${found} of ${totalTargets}</div>
      <div class="chead" style="margin-bottom:.4rem">Find: ${target}</div>
      <div class="mgrid" id="searchGrid" style="grid-template-columns:repeat(${cfg.cols},1fr)">
        ${grid.map((item,i) => `<div class="mcard" style="font-size:${smallText ? '.62rem' : '1.15rem'}" data-i="${i}" onclick="__searchClick(${i})">${item}</div>`).join('')}
      </div>
      <button class="abtn ghost sm" style="margin-top:.6rem" onclick="__searchDone()">Done</button>`, 'focus');
  }
  draw();

  window.__searchClick = i => {
    const cellEl = document.querySelector(`#searchGrid [data-i="${i}"]`);
    if(!cellEl || cellEl.classList.contains('matched')) return;
    if(grid[i] === target){
      cellEl.classList.add('matched'); cellEl.onclick = null;
      found++;
      const fc = document.getElementById('foundCount');
      if(fc) fc.textContent = `Found ${found} of ${totalTargets}`;
      if(found >= totalTargets) later(finishSearch, 500);
    } else {
      wrong++;
      cellEl.classList.add('wrong');
      later(() => cellEl.classList.remove('wrong'), 300);
    }
  };
  window.__searchDone = () => finishSearch();
  function finishSearch(){
    window.__searchClick = () => {}; window.__searchDone = () => {};
    const score = clamp(found / totalTargets - wrong * 0.03, 0, 1);
    finishModule(grade, 'scan', score, score >= 0.6, `${found} of ${totalTargets} found · ${wrong} wrong tap${wrong === 1 ? '' : 's'}`);
  }
}

/* Reading = 1) a few flashed warm-up words (multiple choice), 2) the story
   revealed left-to-right at a grade-paced speed, 3) one comprehension question. */
function exRead(grade){
  const c = readConfig(grade);
  const vocabRounds = Array.from({ length: c.vocab.rounds }, () => ({ target: pick(c.vocab.pool) }));
  let vi = 0, vocabCorrect = 0, qi = 0, compCorrect = 0;
  let measuredWpm = 0, practiceWpm = 0;
  const head = extra => `<div class="ctitle">${c.label}</div>
    <div class="center cmuted" style="font-size:.92rem">Word check ${Math.min(vi+1, c.vocab.rounds)} of ${c.vocab.rounds}</div>${extra}`;

  function vocabNext(){
    if(vi >= c.vocab.rounds){
      const score = (vocabCorrect / c.vocab.rounds) * 0.5 + (compCorrect / c.questions.length) * 0.5;
      const detailText = `read at ${measuredWpm} wpm, practiced at ${practiceWpm} wpm · ${compCorrect} of ${c.questions.length} questions · ${vocabCorrect} of ${c.vocab.rounds} word check`;
      finishModule(grade, 'read', score, score >= c.pass, detailText);
      return;
    }
    const r = vocabRounds[vi];
    card(head(`<p class="cmuted center" style="margin:0 0 .3rem">Press Flash, then watch closely.</p>
      <div class="flashbox" id="flashBox"></div>
      <button class="abtn" id="flashBtn" onclick="__doFlash()">Flash</button>`), 'focus');
    window.__doFlash = () => {
      window.__doFlash = () => {};
      const btn = document.getElementById('flashBtn');
      if(btn) btn.disabled = true;
      const box = document.getElementById('flashBox');
      if(box) box.innerHTML = `<div class="cbig">${r.target.toUpperCase()}</div>`;
      later(() => {
        if(box) box.innerHTML = '';
        later(() => vocabAsk(r), 200);
      }, c.vocab.flash);
    };
  }

  function vocabAsk(r){
    card(head(`<div class="chead" style="margin:.5rem 0 .6rem">What did you see?</div>
      <input type="text" id="vocabInput" class="vinput" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button class="abtn" onclick="__vocabSubmit()">OK</button>`), 'focus');
    const inp = document.getElementById('vocabInput');
    if(inp){
      inp.focus();
      inp.onkeydown = e => { if(e.key === 'Enter') window.__vocabSubmit(); };
    }
    window.__vocabSubmit = () => {
      window.__vocabSubmit = () => {};
      const inputEl = document.getElementById('vocabInput');
      const val = (inputEl.value || '').trim().toLowerCase();
      const ok = val === r.target.toLowerCase();
      if(ok) vocabCorrect++;
      inputEl.disabled = true;
      inputEl.classList.add(ok ? 'right' : 'wrong');
      if(!ok) inputEl.value = r.target.toUpperCase();
      document.querySelectorAll('button.abtn').forEach(b => b.disabled = true);
      later(() => { vi++; vocabNext(); }, ok ? 700 : 1300);
    };
  }

  function startPassage(){
    card(`<div class="ctitle">${c.label}</div>
      <div class="chead">Read the story</div>
      <p class="cbody">${c.passage}</p>
      <button class="abtn" onclick="__firstReadDone()">I’ve read it!</button>`, 'dock');
    const t0 = performance.now();
    window.__firstReadDone = () => {
      window.__firstReadDone = () => {};
      const seconds = (performance.now() - t0) / 1000;
      const wordCount = c.passage.split(' ').length;
      measuredWpm = clamp(Math.round((wordCount / Math.max(seconds, 1)) * 60), 20, 400);
      practiceWpm = measuredWpm;
      showSpeedScreen();
    };
  }

  function showSpeedScreen(){
    card(`<div class="ctitle">${c.label}</div>
      <div class="chead">Nice reading!</div>
      <p class="cmuted center">You read that at about <b>${measuredWpm} words per minute</b>.</p>
      <p class="cmuted center">Now read it again — the words will appear at your practice pace. Want to go faster?</p>
      <div style="display:flex;align-items:center;justify-content:center;gap:1rem;margin:.7rem 0">
        <button class="abtn ghost sm" style="width:auto;padding:.5rem 1rem" onclick="__speedStep(-10)">−</button>
        <div class="chead" style="margin:0" id="speedVal">${practiceWpm} wpm</div>
        <button class="abtn ghost sm" style="width:auto;padding:.5rem 1rem" onclick="__speedStep(10)">+</button>
      </div>
      <button class="abtn" onclick="__startSecondRead()">Read it again</button>`, 'focus');
    window.__speedStep = d => {
      practiceWpm = clamp(practiceWpm + d, 20, 400);
      const el = document.getElementById('speedVal');
      if(el) el.textContent = practiceWpm + ' wpm';
    };
    window.__startSecondRead = () => {
      window.__speedStep = () => {}; window.__startSecondRead = () => {};
      startSecondRead();
    };
  }

  function startSecondRead(){
    card(`<div class="ctitle">${c.label}</div>
      <div class="chead">Read along</div>
      <p class="cbody" id="readText2"></p>`, 'dock');
    revealChunksInto('readText2', c.passage, practiceWpm, c.chunkSize, () => {
      later(askComprehension, 400);
    });
  }

  function askComprehension(){
    if(qi >= c.questions.length){ vocabNext(); return; }
    const cq = c.questions[qi];
    const opts = shuffle(cq.options);
    VIEW.mode = 'quiz';
    card(`<div class="ctitle">Quick check</div>
      <div class="center cmuted" style="font-size:.92rem">Question ${qi + 1} of ${c.questions.length}</div>
      <div class="chead">${cq.q}</div>
      <div class="stack" id="quizOpts">${opts.map((o,k) =>
        `<button class="abtn ${BTN_COLOURS[k % BTN_COLOURS.length]}" id="qopt${k}" onclick="__quizPick(${k})">${o}</button>`).join('')}</div>`, 'focus');
    window.__quizPick = k => {
      window.__quizPick = () => {};
      const chosen = opts[k];
      const ok = chosen === cq.answer;
      if(ok) compCorrect++;
      document.querySelectorAll('#quizOpts .abtn').forEach(b => b.disabled = true);
      document.getElementById('qopt' + k).classList.add(ok ? 'right' : 'wrong');
      if(!ok){
        const el = document.getElementById('qopt' + opts.indexOf(cq.answer));
        if(el) el.classList.add('right');
      }
      later(() => { qi++; askComprehension(); }, ok ? 700 : 1300);
    };
  }

  startPassage();
}

/* --------------------------------- NEAR & FAR (convergence/divergence, in the card) --- */
function exFocus(grade){
  const c = eyeConfig(grade);
  const artSrc = FLYER_ART[c.art] || ART.drop;
  let round = 0, hits = 0, rts = [];

  function startRound(){
    if(round >= c.rounds){
      const score = hits / c.rounds;
      const avgRt = rts.length ? Math.round(rts.reduce((x,y) => x+y, 0)/rts.length) : 0;
      finishModule(grade, 'eye', score, score >= c.pass, `${hits} of ${c.rounds} caught · ${avgRt}ms average`);
      return;
    }
    const phase = round % 2 === 0 ? 'near' : 'far';
    const startScale = phase === 'near' ? c.scaleMin : c.scaleMax;
    const peakScale  = phase === 'near' ? c.scaleMax : c.scaleMin;
    const half = c.cycleMs / 2;
    let tapped = false, windowOpen = false;
    const t0 = performance.now();

    const hint = phase === 'near'
      ? 'Watch it come closer and closer.'
      : 'Watch it drift farther and farther away.';
    const label = phase === 'near' ? 'Tap when it’s CLOSEST!' : 'Tap when it’s FARTHEST!';

    card(`<div class="ctitle">${c.label}</div>
      <div class="center cmuted" style="font-size:.92rem">Round ${round+1} of ${c.rounds}</div>
      <p class="cbody" style="font-size:1rem;margin:.3rem 0">${hint}<br><span class="cmuted" style="font-size:.85rem">Keep it looking like one shape, not double.</span></p>
      <div class="flashbox" style="min-height:170px">
        <div id="focusObj" style="display:inline-block;width:84px;transform:scale(${startScale})">${artSrc}</div>
      </div>
      <div class="chead" style="margin:.2rem 0 .5rem">${label}</div>
      <button class="abtn ghost" id="focusBtn" disabled onclick="__focusTap()">Tap now!</button>`, 'focus');

    const obj = $('#focusObj'), btn = $('#focusBtn');

    window.__focusTap = () => {
      if(!windowOpen || tapped) return;
      tapped = true; hits++;
      rts.push(Math.round(Math.abs(performance.now() - t0 - half)));
      if(btn){ btn.textContent = 'Got it! ✅'; btn.classList.remove('ghost'); btn.classList.add('right'); }
    };

    function loop(now){
      const t = now - t0;
      const scale = t <= half
        ? startScale + (peakScale - startScale) * Math.sin((t/half) * (Math.PI/2))
        : peakScale + (startScale - peakScale) * Math.sin(((t-half)/half) * (Math.PI/2));
      if(obj) obj.style.transform = `scale(${scale.toFixed(3)})`;

      if(!tapped){
        const within = Math.abs(t - half) <= c.window/2;
        if(within !== windowOpen){
          windowOpen = within;
          if(btn){ btn.disabled = !windowOpen; btn.classList.toggle('ghost', !windowOpen); }
        }
      }
      if(t < c.cycleMs){ RAF = requestAnimationFrame(loop); }
      else { RAF = null; round++; later(startRound, 320); }
    }
    RAF = requestAnimationFrame(loop);
  }
  startRound();
}

/* ------------------------------------- MEERKAT MEMORY (in the card) --- */
function exMem(grade){
  const c = memConfig(grade);
  let deck = [];
  if(c.mode === 'category') shuffle(c.categories).slice(0, c.pairs).forEach((p,k) => deck.push({ k, f:p[0] }, { k, f:p[1] }));
  else shuffle(c.pool).slice(0, c.pairs).forEach((p,k) => deck.push({ k, f:p }, { k, f:p }));
  deck = shuffle(deck).map((d, idx) => Object.assign({ id:idx, up:false, matched:false }, d));

  let up = [], matched = 0, moves = 0, lock = false, reshuffled = false, timeUp = false, left = c.time;
  const rows = Math.ceil(deck.length / c.cols);

  // The board is built once; flips only change the card that was touched, so nothing re-animates.
  card(`<div class="ctitle">${c.label}</div>
    <div class="center cmuted" id="mmStatus"></div>
    <div class="mmgrid" id="mmGrid" style="grid-template-columns:repeat(${c.cols},1fr);max-width:min(100%,calc((100vh - 17rem) * ${c.cols} / ${rows}))">
      ${deck.map((d, i) => `<div class="mmcard" id="mm${i}" onclick="__flip(${i})"></div>`).join('')}
    </div>
    <div class="center cmuted" style="margin-top:.6rem">${c.prompt}</div>`, 'focus');

  const status = () => { const el = $('#mmStatus'); if(el) el.textContent = `${moves} tries${c.time ? ' · ⏳ ' + left + 's' : ''}`; };
  const paint = d => {
    const el = $('#mm' + d.id); if(!el) return;
    el.className = 'mmcard' + (d.matched ? ' matched' : d.up ? ' up' : '');
    el.innerHTML = d.matched || d.up ? d.f : '<span class="back">🐾</span>';
  };
  const grid = $('#mmGrid');
  const fit = () => { const first = $('#mm0'); if(grid && first) grid.style.setProperty('--mfs', (first.clientWidth * 0.58) + 'px'); };
  new ResizeObserver(fit).observe(grid);
  fit(); deck.forEach(paint); status();

  window.__flip = id => {
    if(lock || timeUp) return;
    const d = deck.find(x => x.id === id);
    if(!d || d.up || d.matched) return;
    d.up = true; up.push(d); paint(d);
    if(up.length === 2){
      moves++; status(); lock = true;
      const [x, y] = up;
      if(x.k === y.k){
        later(() => {
          x.matched = y.matched = true; up = []; lock = false; matched++; paint(x); paint(y);
          if(c.reshuffle && !reshuffled && matched === Math.ceil(c.pairs/2) && matched < c.pairs){
            reshuffled = true; toast('The cards shuffle!');
            later(() => {
              const open = deck.filter(z => !z.matched);
              const pos = shuffle(open.map(z => z.id));
              open.forEach((z, n) => { z.id = pos[n]; });
              deck.sort((p, q) => p.id - q.id); deck.forEach(paint);
            }, 700);
          }
          if(matched === c.pairs) end();
        }, 380);
      } else {
        later(() => { x.up = y.up = false; up = []; lock = false; paint(x); paint(y); }, 850);
      }
    }
  };
  function end(){
    const score = (matched / c.pairs) * (c.pairs / Math.max(moves, c.pairs));
    finishModule(grade, 'mem', score, score >= c.pass, `${matched} of ${c.pairs} pairs · ${moves} tries${timeUp ? ' · time ran out' : ''}`);
  }
  if(c.time){
    const tick = () => { left--; status(); if(left <= 0){ timeUp = true; end(); return; } later(tick, 1000); };
    later(tick, 1000);
  }
}

/* ==========================================================================
   LEVEL RESULTS
   ========================================================================== */
function bumpStreak(){
  const today = dayKey();
  if(S.streak.last === today) return 'same';
  const gap = S.streak.last ? daysBetween(S.streak.last, today) : 1;
  let note = 'up';
  if(gap === 1 || !S.streak.last) S.streak.count++;
  else if(gap === 2 && S.streak.freezes > 0){ S.streak.freezes--; S.streak.count++; note = 'freeze'; }
  else { S.streak.count = 1; note = 'reset'; }
  S.streak.last = today;
  return note;
}

    <p class="cmuted">Progress is saved to this player’s account on the game server. Accounts use a username and password only — no email address and no analytics.</p>`;
}

function toggleSetting(k){ S.settings[k] = !S.settings[k]; save(); applySettings(); renderSheet(); }
function fontStep(d){ S.settings.fs = clamp(+(S.settings.fs + d*0.1).toFixed(2), 0.85, 1.4); save(); applySettings(); renderSheet(); }
function setCap(m){ S.settings.sessionCap = m; SESSION.capShown = false; save(); renderSheet(); }
function unlockAll(){
  for(let g = 1; g < GRADES_COUNT; g++){
    S.gradeProgress[g] = Object.fromEntries(MODULE_KEYS.map(k => [k, true]));
  }
  save(); closeSheet(); toMap(); toast('Unlocked through the final grade');
}
function resetAll(){ if(!confirm('Reset all progress for this account? This cannot be undone.')) return; S = normalizeState(null); save(); SESSION = { start:Date.now(), capShown:false }; closeSheet(); applySettings(); toMap(); }
function seedDemo(){
  const now = Date.now();
  const grade = currentGrade();
  for(let d = 9; d >= 1; d--){
    MODULE_KEYS.forEach(k => {
      const base = 55 + (9-d)*3 + rnd(14);
      S.log.push({ ts: now - d*86400000, day: dayKey(new Date(now - d*86400000)), grade, module:k,
        score: Math.min(base, 99), pass: base >= 65 });
    });
  }
  S.streak.count = Math.max(S.streak.count, 6);
  save(); renderHud(); renderSheet(); toast('Sample data added');
}

function checkSessionCap(){
  const mins = (Date.now() - SESSION.start)/60000;
  if(!SESSION.capShown && mins >= S.settings.sessionCap){
    SESSION.capShown = true;
    card(`<div class="ctitle">Eye break</div>
      <div style="width:30%;margin:.3rem auto">${ART.drop}</div>
      <div class="chead">Time to look far away</div>
      <p class="cmuted center">You’ve been playing for ${Math.round(mins)} minutes. Rest your eyes on something distant, then come back.</p>
      <div class="stack"><button class="abtn" onclick="toMap()">Take a break</button>
      <button class="abtn ghost sm" onclick="mapCard()">Keep going</button></div>`, 'focus');
    return true;
  }
  return false;
}

/* keep #scene sized+centered to always cover the viewport at a locked 16:9 art
   aspect, computed directly from window dimensions (not vh/vw+calc, which some
   browsers resolve inconsistently and can leave gaps down the sides). */
function fitScene(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.max(vw / 1600, vh / 900);
  const scene = $('#scene');
  if(!scene) return;
  scene.style.width = Math.ceil(1600 * scale) + 'px';
  scene.style.height = Math.ceil(900 * scale) + 'px';
}
let fitTimer = null;
function scheduleFit(){
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitScene, 80);
}
window.addEventListener('resize', scheduleFit);
new ResizeObserver(scheduleFit).observe(document.body);

/* ------------------------------------------------------------------ init */
/* ==========================================================================
   SIGN IN · CREATE ACCOUNT · PROFILE
   ========================================================================== */
let AUTH = { mode:'login', username:'', grade:'', busy:false };
const gradeOptions = (sel, placeholder) =>
  (placeholder ? `<option value="" ${sel ? '' : 'selected'} disabled>${placeholder}</option>` : '') +
  Array.from({ length:GRADES_COUNT }, (_, i) => `<option value="${i + 1}" ${+sel === i + 1 ? 'selected' : ''}>Grade ${i + 1}</option>`).join('');

function authCard(msg){
  const reg = AUTH.mode === 'register';
  card(`<div style="width:26%;margin:0 auto">${meerkatSVG()}</div>
    <div class="ctitle">Meerkat Vision Quest</div>
    <div class="chead">${reg ? 'Make your account' : 'Welcome back!'}</div>
    <div class="tabs" style="justify-content:center;margin:.2rem 0">
      <button class="tab ${reg ? '' : 'on'}" onclick="authMode('login')">Log in</button>
      <button class="tab ${reg ? 'on' : ''}" onclick="authMode('register')">Create account</button></div>
    <input class="vinput" id="auUser" placeholder="Username" maxlength="20" autocomplete="username" autocapitalize="off" spellcheck="false" value="${esc(AUTH.username)}">
    <input class="vinput" id="auPass" type="password" placeholder="Password" maxlength="128" autocomplete="${reg ? 'new-password' : 'current-password'}">
    ${reg ? `<select class="vinput" id="auGrade" aria-label="What grade are you in?">${gradeOptions(AUTH.grade, 'What grade are you in?')}</select>
      <div class="cmuted center" style="font-size:.8rem">Tip: use a fun nickname instead of your real name, and ask a grown-up to help.</div>` : ''}
    <div class="autherr" id="auErr">${esc(msg || '')}</div>
    <button class="abtn" id="auGo" onclick="authSubmit()">${reg ? 'Create my account' : 'Log in'}</button>`, 'focus');
  document.querySelectorAll('#auUser, #auPass').forEach(el => {
    el.onkeydown = e => { if(e.key === 'Enter') authSubmit(); };
  });
  const first = $('#auUser'); if(first) first.focus();
}
function authMode(m){
  const u = $('#auUser'), g = $('#auGrade');
  if(u) AUTH.username = u.value;
  if(g) AUTH.grade = g.value;
  AUTH.mode = m; authCard();
}
async function authSubmit(){
  if(AUTH.busy) return;
  const reg = AUTH.mode === 'register';
  const username = $('#auUser').value.trim().toLowerCase();
  const grade = reg ? parseInt($('#auGrade').value, 10) : 0;
  const password = $('#auPass').value;
  AUTH.username = username; AUTH.grade = grade || '';
  const fail = t => { const e = $('#auErr'); if(e) e.textContent = t; };
  if(!/^[a-z0-9_]{3,20}$/.test(username)) return fail('Username: 3 to 20 letters, numbers or _ (no spaces)');
  if(!password) return fail('Please type your password');
  if(reg && password.length < 6) return fail('Password needs at least 6 characters');
  if(reg && !(grade >= 1 && grade <= GRADES_COUNT)) return fail('Please choose the grade you are in');
  AUTH.busy = true; fail('');
  const go = $('#auGo'); if(go) go.disabled = true;
  try{
    const sess = await api('POST', reg ? '/api/auth/register' : '/api/auth/login',
      reg ? { username, password, start_grade:grade } : { username, password });
    TOKEN = sess.token; store.write(TOKEN_KEY, TOKEN);
    AUTH.busy = false;
    enterGame(sess);
  }catch(e){
    AUTH.busy = false;
    fail(e.message);
    const g = $('#auGo'); if(g) g.disabled = false;
  }
}

function enterGame(sess){
  USER = sess.user;
  S = normalizeState(sess.state);
  if(S.streak.last && daysBetween(S.streak.last, dayKey()) > 2) S.streak.count = 0;
  SESSION = { start: Date.now(), capShown:false };
  applySettings();
  toMap();
  if(!sess.state) save();
}

function signedOut(){
  clearTimeout(saveTimer); saveTimer = null;
  TOKEN = null; USER = null; store.remove(TOKEN_KEY);
  S = normalizeState(null); RUN = null; clearTimers(); night(false); clearCard();
  $('#fx').className = ''; $('#fx').innerHTML = '';
  closeSheet(); VIEW.mode = 'map'; VIEW.msg = null;
  AUTH = { mode:'login', username:'', grade:'', busy:false };
  applySettings(); setScene('map'); renderHud(); authCard();
}
async function logout(){
  if(saveTimer) await pushState();
  if(!USER) return;
  if(saveTimer){ toast('Couldn’t save your progress yet — check your connection and try again'); return; }
  try{ await api('POST', '/api/auth/logout'); }catch(e){}
  signedOut();
}

function profileSheet(){
  const modulesDone = [...Array(GRADES_COUNT)].reduce((n, _, i) => n + gradeModulesDoneCount(i + 1), 0);
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem">
      <h2 class="sh" style="margin:0">My profile</h2>
      <button class="tab" onclick="closeSheet()">Close</button></div>
    <div style="width:84px;margin:.4rem auto 0">${meerkatSVG()}</div>
    <div class="center chead" style="margin:0">${esc(USER.username)}</div>
    <div class="center cmuted">joined ${esc(USER.created_at.slice(0, 10))}</div>
    <div class="statgrid" style="margin:1rem 0;justify-content:center;text-align:center">
      <div><span class="cmuted">Grade</span><b>${currentGrade()} / ${GRADES_COUNT}</b></div>
      <div><span class="cmuted">Modules done</span><b>${modulesDone} / ${GRADES_COUNT * 4}</b></div>
      <div><span class="cmuted">Streak</span><b>🔥 ${S.streak.count}</b></div>
      <div><span class="cmuted">Gems</span><b>💎 ${S.gems}</b></div></div>
    <h2 class="sh">Starting grade</h2>
    <select class="vinput" id="profGrade" aria-label="Starting grade">${gradeOptions(USER.start_grade)}</select>
    <div class="autherr" id="profMsg"></div>
    <div class="stack">
      <button class="abtn" onclick="saveProfile()">Save grade</button>
      <button class="abtn ghost sm" onclick="logout()">Log out</button></div>
    <div class="cmuted center" style="font-size:.72rem;margin-top:.8rem">Game version ${esc(BUILD.startsWith('__') ? 'dev' : BUILD)}</div>`;
}
async function saveProfile(){
  const msg = (t, ok) => { const e = $('#profMsg'); if(e){ e.textContent = t; e.style.color = ok ? 'var(--green-d)' : ''; } };
  try{
    USER = await api('PATCH', '/api/me', { start_grade:parseInt($('#profGrade').value, 10) });
    renderSheet(); msg('Saved!', true);
    renderHud(); if(VIEW.mode === 'map'){ renderWorld(); mapCard(); }
  }catch(e){
    if(e.status === 401){ signedOut(); return; }
    msg(e.message);
  }
}

/* when a new version goes live, an open tab picks it up on its own (never in the middle of a task) */
async function checkForUpdate(){
  if(BUILD.startsWith('__') || RUN || document.visibilityState !== 'visible') return;
  try{
    const res = await fetch('/api/health', { cache:'no-store' });
    const d = await res.json();
    if(d.version && d.version !== BUILD) location.reload();
  }catch(e){}
}
setInterval(checkForUpdate, 30000);
document.addEventListener('visibilitychange', checkForUpdate);

async function boot(){
  if(!TOKEN){ authCard(); return; }
  card(`<div class="chead">Loading your adventure…</div>`, 'focus');
  try{ enterGame(await api('GET', '/api/me')); }
  catch(e){
    if(e.status === 401){ TOKEN = null; store.remove(TOKEN_KEY); authCard(); }
    else card(`<div class="chead">Hmm, we can’t reach the game</div>
      <p class="cmuted center">${esc(e.message)}</p>
      <button class="abtn" onclick="boot()">Try again</button>`, 'focus');
  }
}

(function init(){
  applySettings();
  fitScene();
  setScene('map');
  // the viewport isn't always settled by the time this first measurement runs
  // (e.g. right after a resize/restore) — re-check shortly after first paint.
  requestAnimationFrame(fitScene);
  setTimeout(fitScene, 300);
  boot();
})();

</script>
</body>
</html>
